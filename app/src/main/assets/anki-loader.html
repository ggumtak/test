<!-- 한자 바로보기 로더 (AnkiDroid): 코드는 이 노트 유형의 스타일(CSS) 끝에 있고 한자 바로보기 앱이 바꿉니다. 이 블록은 바뀌지 않습니다. -->
<script>
(function () {
  if (!/Android/.test(navigator.userAgent)) return;
  var w = window;
  if (w.__hjtapRun) { w.__hjtapRun(); return; }
  try {
    var raw = getComputedStyle(document.documentElement).getPropertyValue('--hjtap-code').trim().replace(/^["']|["']$/g, '');
    if (!raw) return;
    var bin = atob(raw), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    (new Function(new TextDecoder('utf-8').decode(bytes)))();
    var code = w.__hjCode || {}, best = 0;
    for (var k in code) if (+k > best) best = +k;
    if (best) code[best]();
  } catch (e) {}
})();
</script>
